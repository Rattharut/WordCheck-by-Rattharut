<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover = ให้เนื้อหากินพื้นที่ถึงขอบจอบนมือถือที่มีติ่ง/มุมโค้ง -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#22c55e" />
  <title>Translator by Rattharut</title>
  <link rel="stylesheet" href="Reset.css" />
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge">Dictionary & Translator</span>
      <h1>Thai to English, Beautifully.</h1>
      <p>คุณสามารถแปลคำและประโยคภาษาไทย เพื่อฟังการออกเสียงและดูคำพ้องความหมาย</p>
    </header>

    <section class="card">
      <div class="input-row">
        <textarea id="input" placeholder="พิมพ์คำหรือประโยคภาษาไทย... (e.g. สวัสดี, ความสุข, ฉันรักการเรียนรู้)" autofocus></textarea>
        <div class="actions">
          <span class="hint">Tip: Press <b>Ctrl/Cmd + Enter</b> to translate</span>
          <button id="translateBtn" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14M9 4v4M7 20l4-10 4 10M8 17h6"/></svg>
            Translate
          </button>
        </div>
      </div>
    </section>

    <section id="resultCard" class="card" style="display:none">
      <div class="result-head">
        <div class="result-main">
          <div class="src-label">Translation</div>
          <div class="translation">
            <span id="translationText"></span>
            <button id="speakBtn" class="btn-icon btn" title="Listen">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="voice-row">
        <label for="voiceSelect">Voice / Accent:</label>
        <select id="voiceSelect"></select>
      </div>

      <div id="dictSection"></div>
    </section>

    <div id="status"></div>

    <footer>บริการแปลภาษาไทยเป็นภาษาอังกฤษฟรี</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
